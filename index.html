<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wireframe Janus Optimize em português">
  <title>Janus Optimize — Wireframe</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{--ink:#1c2a26;--forest:#27483d;--sage:#c8d4c2;--sand:#f2ede5;--copper:#b7794b;--cream:#fbfaf7;--line:#d8ded8;--muted:#68746c;--shadow:0 24px 70px rgba(28,42,38,.12)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.shell{width:min(1180px,calc(100% - 48px));margin:auto}.announcement{background:var(--forest);color:#fff;text-align:center;padding:10px;font-size:11px;letter-spacing:1.3px;text-transform:uppercase}.header{background:var(--forest);border-bottom:1px solid rgba(255,255,255,.14)}.header-inner{height:84px;display:flex;align-items:center;justify-content:space-between;gap:30px}.logo-wrap{width:188px;min-height:42px;display:flex;align-items:center}.logo{width:188px;height:auto;display:block}.logo-fallback{display:none;color:#fff;font:24px Georgia,serif;letter-spacing:3px}.logo-fallback span{color:#e8c27a}.nav{display:flex;gap:30px;align-items:center}.nav a{color:#fff;font-size:12px;font-weight:700;letter-spacing:1.5px;text-decoration:none}.nav a:hover{color:var(--sage)}.icons{color:#fff;font-size:20px;white-space:nowrap}.menu{display:none;color:#fff;font-size:22px}.hero{background:var(--sage);min-height:550px;display:grid;align-items:center}.hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.eyebrow{color:var(--copper);font-size:11px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase}.hero h1{font:400 clamp(42px,6vw,78px)/.98 Georgia,serif;max-width:600px;margin:18px 0}.hero h1 em{color:var(--forest);font-style:normal}.hero p{font-size:17px;line-height:1.65;max-width:480px}.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:28px}.button{padding:15px 24px;border:1px solid var(--ink);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;text-decoration:none;display:inline-block}.primary{color:#fff;background:var(--forest);border-color:var(--forest)}.secondary{color:var(--ink);background:transparent}.product-stage{height:400px;position:relative}.bottle{position:absolute;bottom:16px;width:180px;height:270px;border-radius:18px 18px 28px 28px;background:linear-gradient(135deg,#f8f4ed,#c7d2c2);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;text-align:center;transform:rotate(-8deg);font:24px Georgia,serif}.bottle:before{content:"";position:absolute;top:-30px;width:120px;height:38px;background:var(--forest);border-radius:7px 7px 2px 2px}.bottle small{display:block;font:700 8px Arial;letter-spacing:1.5px;margin-top:14px}.bottle-main{left:26%;z-index:2}.bottle-side{left:51%;height:230px;width:150px;transform:rotate(10deg);background:linear-gradient(135deg,#efe1d2,#bd8a62);z-index:1}.bottle-side:before{background:var(--copper)}section{padding:90px 0}.heading{text-align:center;margin-bottom:40px}.heading h2{font:400 clamp(32px,4vw,50px) Georgia,serif;margin:10px 0}.heading p{color:#5b6861}.categories,.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.category{min-height:260px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;text-decoration:none;color:var(--ink);background:var(--sand);position:relative;overflow:hidden}.category:nth-child(2){background:var(--sage)}.category:nth-child(3){background:#ead8c5}.category:before{content:"JANUS";position:absolute;right:-20px;top:20px;font:700 72px Georgia;color:rgba(255,255,255,.35);transform:rotate(-18deg)}.category h3{font:400 29px Georgia;margin:0 0 8px}.category p{max-width:210px;font-size:13px;line-height:1.5}.category strong{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;margin-top:12px}.new{background:var(--forest);color:#fff}.new-grid{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}.new h2{font:400 clamp(34px,4vw,54px) Georgia;margin:12px 0}.new p{color:#dce6dc;line-height:1.7;max-width:450px}.new .eyebrow{color:#d6a477}.new-visual{height:300px;background:linear-gradient(135deg,#496758,#263e34);display:flex;align-items:center;justify-content:center}.new .bottle{position:relative;left:auto;bottom:auto;transform:rotate(5deg);height:230px;width:155px}.best{background:var(--sand)}.card{background:#fff;padding:16px}.card-visual{height:230px;background:var(--cream);display:flex;align-items:center;justify-content:center}.card .bottle{position:relative;left:auto;bottom:auto;transform:scale(.62);box-shadow:none;margin:-30px}.card h3{font:400 20px Georgia;margin:20px 0 8px}.card small{color:#66726a;font-size:11px}.card strong{display:block;margin-top:14px;font-size:13px}.discover{background:var(--sage);text-align:center}.discover p{max-width:560px;margin:0 auto 25px;line-height:1.7}.footer{background:var(--ink);color:#fff;padding:60px 0 20px}.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:50px}.footer strong{font:20px Georgia,serif}.footer p,.footer a{color:#cbd5cd;font-size:13px;line-height:1.7}.footer nav{display:grid;gap:8px}.footer a{text-decoration:none}.footer-bottom{border-top:1px solid rgba(255,255,255,.16);margin-top:45px;padding-top:20px;color:#a9b6ac;font-size:11px}.page-head{padding:70px 0 30px}.page-head h1{font:400 clamp(38px,5vw,64px) Georgia;margin:12px 0}.page-head p{color:var(--muted);max-width:650px}.panel{background:#fff;border:1px solid var(--line);padding:28px;border-radius:8px}.catalog-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:90px}.catalog-card{background:#fff;border:1px solid var(--line);padding:16px}.catalog-card .visual{height:180px;background:var(--sand);display:grid;place-items:center}.catalog-card h3{font:22px Georgia;margin:18px 0 6px}.catalog-card p{color:var(--muted);font-size:13px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:50px;padding:70px 0}.detail-visual{background:var(--sand);min-height:440px;display:grid;place-items:center}.detail .bottle{position:relative;left:auto;bottom:auto;transform:none}.detail h1{font:400 clamp(42px,6vw,78px) Georgia;margin:14px 0}.price{font:28px Georgia;margin:28px 0}.cart-layout,.checkout-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:28px;padding-bottom:90px}.summary{background:var(--sand);padding:26px;border-radius:8px}.summary h3{font:22px Georgia;margin-top:0}.field{margin:0 0 18px}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.field input{width:100%;border:1px solid var(--line);padding:13px;background:#fff}.faq-list{max-width:800px;margin:0 auto 90px}.faq-item{padding:22px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-weight:700}.hidden{display:none}
    @media(max-width:800px){.shell{width:min(100% - 32px,560px)}.nav,.icons{display:none}.menu{display:block}.header-inner{height:72px}.logo{width:170px}.hero{padding:60px 0}.hero-grid,.new-grid,.detail,.cart-layout,.checkout-layout{grid-template-columns:1fr}.product-stage{height:330px}.categories,.products,.catalog-grid{grid-template-columns:1fr}section{padding:62px 0}.footer-grid{grid-template-columns:1fr;gap:28px}.page-head{padding:50px 0 25px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const productNames=['TH9507','Wolverine Blend','CJC Blend'];
    const bottle=(name='JANUS', extra='')=>`<div class="bottle ${extra}"><span>${name}<small>JANUS<br>RESEARCH SERIES</small></span></div>`;
    const header=()=>`<div class="announcement">Frete grátis em pedidos selecionados · Produtos para pesquisa</div><header class="header"><div class="shell header-inner"><a class="logo-wrap" href="#home"><img class="logo" src="./assets/janus-logo.png" alt="Janus Optimize" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><span class="logo-fallback">JANUS<span>+</span></span></a><nav class="nav"><a href="#about">SOBRE</a><a href="#category">FITNESS</a><a href="#category">BELEZA</a><a href="#category">VITALIDADE</a><a href="#category">MAIS VENDIDOS</a></nav><div class="icons">⌕　♙　♧</div><span class="menu">☰</span></div></header>`;
    const footer=()=>`<footer class="footer"><div class="shell footer-grid"><div><strong>JANUS OPTIMIZE</strong><p>Compostos de alta pureza para pesquisa e identificação.</p></div><nav><strong>Comprar</strong><a href="#category">Todos os produtos</a><a href="#category">Mais vendidos</a><a href="#home">Novidades</a></nav><nav><strong>Ajuda</strong><a href="#about">Sobre a Janus</a><a href="#faq">Perguntas frequentes</a><a href="#about">Políticas e contato</a></nav></div><div class="shell footer-bottom">© 2026 Janus Optimize. Wireframe em português para aprovação visual.</div></footer>`;
    const cards=()=>productNames.map(n=>`<article class="card"><div class="card-visual">${bottle(n)}</div><h3>${n}</h3><small>Performance e recuperação</small><strong>Ver produto →</strong></article>`).join('');
    function home(){return `${header()}<main id="home"><section class="hero"><div class="shell hero-grid"><div><span class="eyebrow">Ciência para sua melhor versão</span><h1>Otimize sua <em>transformação.</em></h1><p>Compostos de alta pureza, informação clara e uma curadoria feita para quem busca evolução com consistência.</p><div class="actions"><a class="button primary" href="#category">Explorar produtos</a><a class="button secondary" href="#about">Conheça a Janus</a></div></div><div class="product-stage">${bottle('JANUS','bottle-main')}${bottle('K-GLOW','bottle-side')}</div></div></section><section><div class="shell"><div class="heading"><span class="eyebrow">Encontre o seu foco</span><h2>Explore por categoria</h2><p>Uma jornada de otimização começa com o objetivo certo.</p></div><div class="categories"><a class="category" href="#category"><h3>Fitness</h3><p>Performance, recuperação e composição corporal.</p><strong>Explorar →</strong></a><a class="category" href="#category"><h3>Beleza</h3><p>Fórmulas pensadas para pele, cabelo e radiância.</p><strong>Explorar →</strong></a><a class="category" href="#category"><h3>Vitalidade</h3><p>Suporte para energia, longevidade e bem-estar.</p><strong>Explorar →</strong></a></div></div></section><section class="new"><div class="shell new-grid"><div><span class="eyebrow">Novidade Janus</span><h2>K-Glow<br>com Copper</h2><p>Suporte à saúde da pele, colágeno e radiância com um impulso de KPV.</p><a class="button secondary" href="#product">Descobrir</a></div><div class="new-visual">${bottle('K-GLOW')}</div></div></section><section class="best"><div class="shell"><div class="heading"><span class="eyebrow">Escolhidos pela comunidade</span><h2>Mais vendidos</h2></div><div class="products">${cards()}</div></div></section><section class="discover"><div class="shell"><span class="eyebrow">Alta pureza. Mais clareza.</span><h2>Compromisso com sua pesquisa</h2><p>Na Janus Optimize, cada produto é apresentado com transparência para apoiar sua jornada de pesquisa e identificação.</p><a class="button secondary" href="#about">Ler mais</a></div></section></main>${footer()}`}
    function category(){return `${header()}<main><div class="shell page-head"><span class="eyebrow">Coleção Fitness</span><h1>Performance e recuperação</h1><p>Uma seleção para quem busca consistência em cada etapa da jornada.</p></div><div class="shell catalog-grid">${cards()}${cards()}</div></main>${footer()}`}
    function product(){return `${header()}<main><div class="shell detail"><div class="detail-visual">${bottle('TH9507')}</div><div><span class="eyebrow">Fitness / Pesquisa</span><h1>TH9507</h1><p>Tesamorelina</p><div class="price">US$ 70,00</div><p>Composto apresentado para pesquisa e identificação.</p><a class="button primary" href="#cart">Adicionar ao carrinho</a></div></div></main>${footer()}`}
    function cart(){return `${header()}<main><div class="shell page-head"><span class="eyebrow">Sua seleção</span><h1>Carrinho</h1></div><div class="shell cart-layout"><div class="panel"><h2>TH9507</h2><p>Tesamorelina / 1 unidade</p><strong>US$ 70,00</strong></div><aside class="summary"><h3>Resumo</h3><p>Subtotal <b style="float:right">US$ 70,00</b></p><h3>Total <b style="float:right">US$ 70,00</b></h3><a class="button primary" href="#checkout">Ir para checkout</a></aside></div></main>${footer()}`}
    function checkout(){return `${header()}<main><div class="shell page-head"><span class="eyebrow">Finalização segura</span><h1>Checkout</h1></div><div class="shell checkout-layout"><div class="panel"><div class="field"><label>E-mail</label><input placeholder="Digite seu e-mail"></div><div class="field"><label>Nome completo</label><input placeholder="Digite seu nome completo"></div><div class="field"><label>Endereço de entrega</label><input placeholder="Digite seu endereço"></div><div class="field"><label>Cidade / Estado / CEP</label><input placeholder="Digite sua cidade, estado e CEP"></div></div><aside class="summary"><h3>Seu pedido</h3><p>TH9507 <span style="float:right">US$ 70,00</span></p><p>1 unidade</p><h3>Total <span style="float:right">US$ 70,00</span></h3><a class="button primary" href="#checkout">Continuar para pagamento</a></aside></div></main>${footer()}`}
    function about(){return `${header()}<main><div class="shell page-head"><span class="eyebrow">Sobre a Janus Optimize</span><h1>Ciência, clareza e otimização contínua.</h1><p>Uma marca para quem pesquisa, entende e busca evoluir com consistência.</p></div><section class="discover"><div class="shell"><h2>Alta pureza. Mais clareza.</h2><p>Cada produto é apresentado com transparência para apoiar sua jornada de pesquisa e identificação.</p></div></section></main>${footer()}`}
    function faq(){return `${header()}<main><div class="shell page-head"><span class="eyebrow">Ajuda e informação</span><h1>Perguntas frequentes</h1><p>Respostas diretas para comprar e pesquisar com mais clareza.</p></div><div class="shell faq-list">${['Para que servem os produtos?','Como escolher uma categoria?','Como acompanho meu pedido?','Quais são as políticas de envio?','Como entrar em contato?'].map(q=>`<div class="faq-item"><span>${q}</span><span>+</span></div>`).join('')}</div></main>${footer()}`}
    const routes={home,category,product,cart,checkout,about,faq}; function render(){const key=location.hash.slice(1)||'home';document.getElementById('app').innerHTML=(routes[key]||home)();window.scrollTo(0,0)}window.addEventListener('hashchange',render);render();
  </script>
</body>
</html>
