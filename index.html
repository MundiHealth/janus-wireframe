<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Janus Optimize — Wireframe</title><link rel="icon" href="assets/favicon.svg"><style>
:root{--ink:#171717;--muted:#696969;--cream:#f6f5f1;--line:#deddd8;--dark:#20201f}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1200px,calc(100% - 56px));margin:auto}.top{text-align:center;background:#f1f0ec;padding:9px;font-size:10px;letter-spacing:1.6px}.head{height:92px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{width:205px}.nav{display:flex;gap:30px;font-size:11px;letter-spacing:1.5px}.tools{font-size:18px}.hero{min-height:600px;background:linear-gradient(90deg,#0006,#0001),url('assets/official/Leaves-Home.jpg') center/cover;display:flex;align-items:center;color:#fff}.hero-copy{padding:80px 0;max-width:580px}.hero h1{font:400 clamp(46px,7vw,84px)/.95 Georgia,serif;margin:15px 0 22px}.hero p{font-size:17px;line-height:1.6}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase}.btn{display:inline-block;margin-top:24px;padding:14px 27px;border:1px solid currentColor;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}.dark{background:var(--dark);color:#fff;border-color:var(--dark)}section{padding:90px 0}.arrival,.discover{background:var(--cream)}.two{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:70px}.visual{height:390px;background:#eadfd5 url('assets/official/KGlow-Copper.png') center/contain no-repeat}.copy h2,.heading h2{font:400 clamp(38px,5vw,65px) Georgia,serif;margin:15px 0}.copy p,.heading p{color:var(--muted);line-height:1.7;max-width:470px}.center{text-align:center}.categories,.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:42px}.category{min-height:320px;padding:28px;display:flex;align-items:flex-end;color:#fff;background:linear-gradient(#0001,#0009),url('assets/official/aerial-pattern.jpg') center/cover}.category:nth-child(2){background-image:linear-gradient(#0001,#0009),url('assets/official/Leaves-Home.jpg')}.category:nth-child(3){background-image:linear-gradient(#0001,#0009),url('assets/official/Leaves-Home.jpg')}.category h3{font:400 34px Georgia;margin:0 0 8px}.category p{margin:0;font-size:13px}.sale{min-height:460px;background:linear-gradient(#0007,#0007),url('assets/official/Leaves-Home.jpg') center/cover;color:#fff;text-align:center;display:flex;align-items:center}.sale h2{font:400 clamp(42px,6vw,72px) Georgia;max-width:760px;margin:15px auto}.count{display:flex;justify-content:center;gap:36px;margin:30px}.count b{font:400 32px Georgia;display:block}.count span{font-size:9px;text-transform:uppercase;letter-spacing:1px}.product{border:1px solid var(--line);background:#fff}.product-img{height:280px;background:var(--cream) url('assets/official/BPC-Hero2.png') center/auto 85% no-repeat}.product:nth-child(2) .product-img{background-image:url('assets/official/KGlow-Copper.png');background-size:80% auto}.product:nth-child(3) .product-img{background-image:url('assets/official/petry-powder.png');background-size:90% auto}.product-info{padding:20px}.product h3{font:400 20px Georgia;margin:0 0 8px}.product p{color:var(--muted);font-size:12px;line-height:1.5;min-height:34px}.discover-img{height:370px;background:url('assets/official/petry-powder.png') center/cover}.footer{background:var(--dark);color:#fff;padding:60px 0 22px}.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.4fr;gap:30px}.footer .logo{filter:brightness(0) invert(1);margin-bottom:16px}.footer strong{font-size:11px;letter-spacing:1.5px}.footer a,.footer p{display:block;color:#c9c9c5;font-size:12px;line-height:1.8}.bottom{border-top:1px solid #555;margin-top:42px;padding-top:18px;color:#aaa;font-size:10px}.page{padding:70px 0;min-height:600px}.page h1{font:400 clamp(42px,6vw,74px) Georgia}.panel{background:var(--cream);padding:28px;border:1px solid var(--line)}.checkout{display:grid;grid-template-columns:1fr .6fr;gap:24px}.field{margin-bottom:18px}.field label{display:block;font-size:12px;font-weight:bold;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line)}@media(max-width:760px){.wrap{width:calc(100% - 32px)}.nav,.tools{display:none}.head{height:72px}.logo{width:170px}.two,.checkout{grid-template-columns:1fr}.categories,.products{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}section{padding:62px 0}.hero{min-height:540px}}
</style></head><body><div id="app"></div><script>
const logo=()=>`<img class="logo" src="assets/official/Janus_Large_Logo.png" alt="Janus Optimize">`;const header=()=>`<div class="top">FRETE GRÁTIS EM PEDIDOS SELECIONADOS</div><header><div class="wrap head"><a href="#home">${logo()}</a><nav class="nav"><a href="#about">SOBRE</a><a href="#category">FITNESS</a><a href="#category">BELEZA</a><a href="#category">VITALIDADE</a><a href="#bestsellers">MAIS VENDIDOS</a></nav><div class="tools">⌕　♙</div></div></header>`;const footer=()=>`<footer class="footer"><div class="wrap footer-grid"><div>${logo()}<p>Compostos para pesquisa, identificação e otimização.</p></div><div><strong>COMPRAR</strong><a href="#category">Todos os produtos</a><a href="#bestsellers">Mais vendidos</a><a href="#sale">Sale</a><a href="#about">Sobre</a></div><div><strong>LINKS ÚTEIS</strong><a href="#faq">Termos e condições</a><a href="#faq">Política de privacidade</a><a href="#faq">FAQ</a></div><div><strong>EMPRESA</strong><p>service@janusoptimize.com<br>4400 34th St. N Unit H<br>Saint Petersburg, FL 33713</p></div></div><div class="wrap bottom">© 2025 por JANUS OPTIMIZATION INC. · Produtos destinados exclusivamente à pesquisa e identificação.</div></footer>`;const prod=(n,d,p)=>`<article class="product"><div class="product-img"></div><div class="product-info"><h3>${n}</h3><p>${d}</p><b>${p}</b><br><a class="btn" href="#product">VER PRODUTO</a></div></article>`;
function home(){return `${header()}<main><section class="hero"><div class="wrap hero-copy"><span class="eyebrow">Janus Optimize</span><h1>Otimize sua transformação</h1><p>Explore nossos peptídeos testados e produtos de alta qualidade.</p><a class="btn" href="#category">COMPRAR AGORA</a></div></section><section class="arrival"><div class="wrap two"><div class="visual"></div><div class="copy"><span class="eyebrow">Novidade</span><h2>KPV Glow</h2><p>Saúde da pele + suporte ao colágeno + radiância e rejuvenescimento com um impulso de KPV.</p><a class="btn dark" href="#product">DESCOBRIR</a></div></div></section><section><div class="wrap"><div class="heading center"><span class="eyebrow">Explore</span><h2>Compre por categoria</h2></div><div class="categories"><a class="category" href="#category"><div><h3>FITNESS</h3><p>Performance e recuperação</p></div></a><a class="category" href="#category"><div><h3>VITALIDADE</h3><p>Energia e longevidade</p></div></a><a class="category" href="#category"><div><h3>BELEZA</h3><p>Pele, cabelo e radiância</p></div></a></div></div></section><section class="sale" id="sale"><div class="wrap"><span class="eyebrow">Oferta especial</span><h2>Não perca a oportunidade!</h2><p>Nossa maior sale do ano termina em breve.</p><div class="count"><div><b>02</b><span>Dias</span></div><div><b>14</b><span>Horas</span></div><div><b>36</b><span>Minutos</span></div><div><b>48</b><span>Segundos</span></div></div><a class="btn" href="#category">COMPRAR NA SALE</a></div></section><section id="bestsellers"><div class="wrap"><div class="heading center"><span class="eyebrow">Escolhidos pela comunidade</span><h2>Mais vendidos</h2><p>Os produtos preferidos da nossa comunidade de otimização.</p></div><div class="products">${prod('TH9507 (Tesamorelin)','Produto para pesquisa e identificação.','$70.00')}${prod('Wolverine Blend','Composto para pesquisa e identificação.','$89.00')}${prod('CJC Blend: CJC-1295 without DAC + Ipamorelin','Produto para pesquisa e identificação.','$65.00')}</div></div></section><section class="discover"><div class="wrap two"><div class="discover-img"></div><div class="copy"><span class="eyebrow">Discover</span><h2>Compostos de alta pureza</h2><p>Comprometidos em aprimorar sua pesquisa científica com produtos de qualidade.</p><a class="btn dark" href="#about">LER MAIS</a></div></div></section></main>${footer()}`}
function category(){return `${header()}<main class="page"><div class="wrap"><span class="eyebrow">Janus Optimize</span><h1>Todos os produtos</h1><p>Explore a coleção completa de compostos para pesquisa.</p><div class="products">${prod('TH9507 (Tesamorelin)','Fitness e pesquisa.','$70.00')}${prod('Wolverine Blend','Performance e pesquisa.','$89.00')}${prod('CJC Blend','Fitness e pesquisa.','$65.00')}</div></div></main>${footer()}`}function product(){return `${header()}<main class="page"><div class="wrap checkout"><div class="product-img"></div><div><span class="eyebrow">Fitness</span><h1>TH9507</h1><p>Tesamorelin</p><h2>$70.00</h2><a class="btn dark" href="#cart">ADICIONAR AO CARRINHO</a></div></div></main>${footer()}`}function simple(t,p){return `${header()}<main class="page"><div class="wrap"><span class="eyebrow">Janus Optimize</span><h1>${t}</h1><p>${p}</p></div></main>${footer()}`}function cart(){return `${header()}<main class="page"><div class="wrap checkout"><div class="panel"><h2>TH9507</h2><p>Tesamorelin · 1 unidade</p><b>$70.00</b></div><div class="panel"><h2>Resumo</h2><p>Total <b style="float:right">$70.00</b></p><a class="btn dark" href="#checkout">CHECKOUT</a></div></div></main>${footer()}`}function checkout(){return `${header()}<main class="page"><div class="wrap checkout"><div class="panel"><h2>Informações de contato</h2><div class="field"><label>E-mail</label><input placeholder="Digite seu e-mail"></div><div class="field"><label>Nome completo</label><input placeholder="Digite seu nome"></div><div class="field"><label>Endereço</label><input placeholder="Digite seu endereço"></div></div><div class="panel"><h2>Seu pedido</h2><p>TH9507 <b style="float:right">$70.00</b></p><a class="btn dark" href="#checkout">CONTINUAR</a></div></div></main>${footer()}`}const routes={home,category,product,cart,checkout,about:()=>simple('Sobre a Janus Optimize','Uma marca comprometida em aprimorar sua pesquisa científica com produtos de qualidade.'),faq:()=>simple('Perguntas frequentes','Encontre respostas sobre produtos, pedidos, envio e políticas.')};function render(){let k=location.hash.slice(1)||'home';document.getElementById('app').innerHTML=(routes[k]||home)();scrollTo(0,0)}addEventListener('hashchange',render);render();</script></body></html>
